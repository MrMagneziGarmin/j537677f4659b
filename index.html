<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Only this site's own files; no inline code, no outside connections, no forms posting anywhere. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Journal</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main id="lock" class="lock">
  <svg class="lock-mark" viewBox="0 0 120 120" aria-hidden="true">
    <circle class="ring-track r1" cx="60" cy="60" r="50"/><circle class="ring r1" cx="60" cy="60" r="50"/>
    <circle class="ring-track r2" cx="60" cy="60" r="36"/><circle class="ring r2" cx="60" cy="60" r="36"/>
    <circle class="ring-track r3" cx="60" cy="60" r="22"/><circle class="ring r3" cx="60" cy="60" r="22"/>
  </svg>
  <h1>Journal</h1>
  <p class="lock-sub">Your training and health, encrypted.</p>
  <form id="unlock" autocomplete="on">
    <!-- Lets iPhone Passwords file the password under one name and fill it with Face ID. -->
    <input type="text" name="username" autocomplete="username" value="wod-journal" readonly hidden>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password"
           aria-label="Password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="open">Unlock</button>
    <p id="status" role="status"></p>
  </form>
</main>

<div id="app" class="app" hidden>
  <header class="bar">
    <span id="barTitle" class="bar-title">Today</span>
    <button type="button" id="lockBtn" class="link">Lock</button>
  </header>
  <section id="view-today" class="view" data-title="Today"></section>
  <section id="view-activity" class="view" data-title="Activity" hidden></section>
  <section id="view-sleep" class="view" data-title="Sleep" hidden></section>
  <section id="view-trends" class="view" data-title="Trends" hidden></section>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" class="tab active" data-view="today" aria-label="Today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>
      <span>Today</span>
    </button>
    <button type="button" class="tab" data-view="activity" aria-label="Activity">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>
      <span>Activity</span>
    </button>
    <button type="button" class="tab" data-view="sleep" aria-label="Sleep">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <span>Sleep</span>
    </button>
    <button type="button" class="tab" data-view="trends" aria-label="Trends">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Trends</span>
    </button>
  </nav>
</div>
</body>
</html>
