<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Only this site's own files; no inline code, no outside connections, no forms posting anywhere. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Journal</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main id="lock" class="lock">
  <svg class="lock-mark" viewBox="0 0 120 120" aria-hidden="true">
    <rect class="bar" x="16" y="56" width="88" height="8" rx="4"/>
    <rect class="plate p1" x="22" y="34" width="12" height="52" rx="5"/>
    <rect class="plate p2" x="36" y="42" width="9" height="36" rx="4"/>
    <rect class="plate p1" x="86" y="34" width="12" height="52" rx="5"/>
    <rect class="plate p2" x="75" y="42" width="9" height="36" rx="4"/>
  </svg>
  <h1>Journal</h1>
  <p class="lock-sub">Your training, encrypted.</p>
  <form id="unlock" autocomplete="on">
    <!-- Lets iPhone Passwords file the password under one name and fill it with Face ID. -->
    <input type="text" name="username" autocomplete="username" value="wod-journal" readonly hidden>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password"
           aria-label="Password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="open">Unlock</button>
    <p id="status" role="status"></p>
  </form>
</main>

<div id="app" class="app" hidden>
  <header class="bar">
    <span id="barTitle" class="bar-title">Home</span>
    <span class="bar-actions">
      <span id="syncState" class="pill" role="status" hidden></span>
      <button type="button" id="syncBtn" class="icon-btn" aria-label="Sync with Garmin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18.5 3v4.5H14M5.5 21v-4.5H10"/></svg>
      </button>
      <button type="button" id="lockBtn" class="link">Lock</button>
    </span>
  </header>
  <section id="view-home" class="view" data-title="Home"></section>
  <section id="view-activity" class="view" data-title="Workouts" hidden></section>
  <section id="view-trends" class="view" data-title="Progress" hidden></section>
  <section id="view-coach" class="view" data-title="Coach" hidden></section>
  <section id="view-sleep" class="view" data-title="Sleep" hidden></section>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" class="tab active" data-view="home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>
      <span>Home</span>
    </button>
    <button type="button" class="tab" data-view="activity" aria-label="Workouts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      <span>Workouts</span>
    </button>
    <button type="button" class="tab" data-view="trends" aria-label="Progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Progress</span>
    </button>
    <button type="button" class="tab" data-view="coach" aria-label="Coach">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>
      <span>Coach</span>
    </button>
    <button type="button" class="tab" data-view="sleep" aria-label="Sleep">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <span>Sleep</span>
    </button>
  </nav>
</div>
</body>
</html>
